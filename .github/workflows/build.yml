name: Build Kisan Trade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project and Inject Code
        run: |
          flutter create --org com.kisantrade --project-name kisan_trade kisan_app
          cp main.dart kisan_app/lib/main.dart

      - name: Build Android APK
        run: |
          cd kisan_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KisanTrade-APK
          path: kisan_app/build/app/outputs/flutter-apk/app-release.apk
