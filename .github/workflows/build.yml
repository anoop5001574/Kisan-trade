name: Build Kisan Trade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project, Add Packages & Inject Code
        run: |
          flutter create --org com.kisantrade --project-name kisan_trade kisan_app
          cd kisan_app
          flutter pub add geolocator http
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          cd ..
          find . -maxdepth 1 -iname "*dart" -exec cp -f "{}" kisan_app/lib/main.dart \;

      - name: Build Android APK
        run: |
          cd kisan_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KisanTrade-APK
          path: kisan_app/build/app/outputs/flutter-apk/app-release.apk
